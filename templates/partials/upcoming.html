{#let future = site.collections.reunions.future}
<h2 class="reunions-section-title">Soirées à venir</h2>

<div class="reunions">
  {#if !future.isEmpty}
  {#for reunion in future.reversed}
    {#if reunion_isFirst}
      {#reunion-card reunion cssClass="next" /}
    {#else}
      {#reunion-card reunion cssClass="later" /}
    {/if}
  {/for}
  {#else}
  {#empty /}
  {/if}
</div>
